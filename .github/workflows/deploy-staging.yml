name: Deploy Staging
on:
  push:
    branches:
    - staging


# branch pushes will cancel any running jobs to the same branch
concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: wri-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: wri-staging

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install development gems
        run: bundle install --with=development

      - name: Verify Capistrano installation
        run: |
          bundle list | grep capistrano
          which cap || echo "cap command not found in PATH"
          bundle exec which cap || echo "cap command not found via bundle exec"

      - name: Log run info
        run: echo "This workflow for ref ${{ github.ref }} was triggered by ${{ github.event_name }} event, running on ${{ runner.os }}."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install packages
        run: |
          yarn install --pure-lockfile

      - name: Create .env.map2 file for build of wri-wpsi-2
        run: |
          cat > .env.map2 << EOF
          NEXT_PUBLIC_MAPBOX_API_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_API_ACCESS_TOKEN }}
          WRI_API_URL=${{ vars.WRI_API_URL_STAGING }}
          NEXT_PUBLIC_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_MEASUREMENT_ID }}
          EOF
          echo "Created .env.map2 file with environment variables"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
          echo "Host wri-staging" >> ~/.ssh/config
          echo "  HostName ${{ secrets.STAGING_HOST }}" >> ~/.ssh/config
          echo "  User ${{ secrets.STAGING_USER }}" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
          echo "  IdentitiesOnly yes" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Test SSH connection
        run: ssh wri-staging "echo 'SSH connection successful' && whoami && pwd"

      - name: Deploy to staging
        env:
          RAILS_SERVE_STATIC_FILES: enabled
        run: bundle exec cap staging deploy

      - name: Update deployment status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
