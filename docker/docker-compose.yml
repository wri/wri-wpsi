version: '3.7'

services:
  db:
    image: postgres:11-bullseye
    container_name: wri_db
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wri_app
    volumes:
      - .:/app
    ports:
      - '3010:3000'
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wri-wpsi_development
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - WEBPACKER_DEV_SERVER_HOST=0.0.0.0
      - WEBPACKER_DEV_SERVER_PORT=3035
      - BUNDLE_GEMFILE=/app/Gemfile
    depends_on:
      - db
    user: root
    command: >
      bash -c "
        bundle exec rails db:create db:migrate &&
        bundle exec rails server -b 0.0.0.0 -p 3000
      "

  # chrome:
  #   image: browserless/chrome:1-puppeteer-15.5.0-slim
  #   ports:
  #     - "3333:3333"
  #   # Mount application source code to support file uploading
  #   # (otherwise Chrome won't be able to find files).
  #   # NOTE: Make sure you use absolute paths in `#attach_file`.
  #   environment:
  #     # By default, it uses 3000, which is typically used by Rails.
  #     PORT: 3333
  #     # Set connection timeout to avoid timeout exception during debugging
  #     # https://docs.browserless.io/docs/docker.html#connection-timeout
  #     CONNECTION_TIMEOUT: 600000

volumes:
  dbdata:
  bundle_cache:
  node_modules_cache:
  rails_cache:
